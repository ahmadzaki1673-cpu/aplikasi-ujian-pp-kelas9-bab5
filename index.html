            { q: "Pada sebelah barat, wilayah negara Indonesia berbatasan dengan...", options: ["Papua Nugini", "Laut Cina Selatan", "Samudera Hindia", "Samudera Pasifik"], ans: 2, type: "single" },

            { q: "Rasa cinta tanah air perlu ditanamkan sejak dini. Tindakan yang mencerminkan kecintaan terhadap keutuhan wilayah adalah...", options: ["Menganggap budaya daerahnya lebih tinggi dari budaya daerah lain", "Bangga menggunakan produk dalam negeri dan mempelajari budaya daerah lain", "Mengeksploitasi alam demi kepentingan pribadi", "Menyebarkan ujaran kebencian di media sosial"], ans: 1, type: "single" },
            { q: "Semboyan Bhinneka Tunggal Ika menginspirasi rakyat Indonesia untuk...", options: ["Menjadikan perbedaan sebagai alasan pemisahan wilayah", "Menjaga persatuan dan kesatuan bangsa di tengah perbedaan", "Menyeragamkan seluruh bahasa daerah menjadi satu bahasa lokal saja", "Menolak segala bentuk budaya yang masuk ke desa"], ans: 1, type: "single" },
            { q: "Apabila ada sekelompok orang yang ingin merusak fasilitas umum, sikap kita sebagai warga yang mencintai NKRI adalah...", options: ["Ikut membantu agar cepat selesai", "Mencegah, menegur, dan melaporkan ke pihak berwenang", "Memotret dan menertawakan saja", "Mengabaikan karena bukan milik pribadi"], ans: 1, type: "single" },
            { q: "Lagu kebangsaan atau lagu wajib nasional yang liriknya menegaskan keutuhan wilayah Indonesia yang 'berjajar pulau-pulau' adalah...", options: ["Indonesia Raya", "Padamu Negeri", "Dari Sabang Sampai Merauke", "Berkibarlah Benderaku"], ans: 2, type: "single" },
            { q: "Sishankamrata bermakna bahwa kekuatan pertahanan bertumpu pada...", options: ["Teknologi nuklir yang dimiliki negara", "TNI dan Polri sebagai kekuatan utama, serta rakyat sebagai kekuatan pendukung", "Rakyat sipil sebagai kekuatan tempur utama", "Pasukan perdamaian dari negara asing"], ans: 1, type: "single" },
            { q: "Menjaga keutuhan NKRI berarti menjaga keselamatan bangsa dari...", options: ["Perubahan musim", "Ancaman dan gangguan baik dari dalam maupun luar negeri", "Kegiatan ekspor-impor antaranegara", "Kemajuan teknologi informasi"], ans: 1, type: "single" },
            { q: "Kebijakan pemberian akses kesehatan, jalan, dan jembatan di daerah terpencil adalah bentuk pengamalan Pancasila untuk menguatkan persatuan, khususnya sila...", options: ["Pertama", "Kedua", "Keempat", "Kelima"], ans: 3, type: "single" },
            { q: "Ketidakstabilan isu regional seperti konflik Semenanjung Korea atau geopolitik Laut Cina Selatan dapat mempengaruhi Indonesia. Oleh karena itu, Indonesia harus...", options: ["Ikut berperang membantu salah satu pihak", "Bersikap waspada dan memperkuat ketahanan nasional", "Memutuskan hubungan diplomatik dengan semua pihak yang berkonflik", "Meminta perlindungan pangkalan militer asing"], ans: 1, type: "single" },
            { q: "Memanfaatkan pergaulan luas (termasuk internet) secara positif bagi pelajar untuk NKRI dapat berupa...", options: ["Menyebarkan hoaks tentang kondisi negara", "Mempromosikan keindahan alam dan kekayaan budaya Indonesia ke dunia", "Meretas situs-situs milik pemerintah", "Menghina ideologi bangsa lain"], ans: 1, type: "single" },
            { q: "Sebagai negara hukum, penegakan kedaulatan di laut dilakukan jika ada kapal asing yang masuk tanpa izin dengan tujuan mencuri ikan, maka tindakan tegas negara adalah...", options: ["Menjual ikan bersama-sama kapal tersebut", "Melakukan penangkapan dan proses hukum sesuai kedaulatan NKRI", "Membiarkan asal mereka membayar pajak", "Melarang nelayan lokal melaut"], ans: 1, type: "single" },
            { q: "Untuk menanamkan toleransi, gotong royong, dan cinta kasih antarwarga, tindakan pencegahan konflik yang sangat efektif dilakukan di lingkungan masyarakat adalah...", options: ["Membuat acara dialog antarwarga dan kegiatan kerja bakti", "Membuat peraturan ketat tanpa sosialisasi", "Membangun pagar tinggi di tiap rumah", "Memisahkan tempat tinggal berdasarkan suku"], ans: 0, type: "single" },
            { q: "Menjaga alam dan lingkungan sekitar merupakan wujud...", options: ["Mencari keuntungan isidental", "Komitmen menjaga NKRI di level komunitas", "Kewajiban pemerintah pusat semata", "Menghambat proses industrialisasi"], ans: 1, type: "single" }
        ];

        // Utility: Acak Array (Fisher-Yates)
        const shuffleArray = (array) => {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const App = () => {
            const [step, setStep] = useState('login'); // login, test, submitting, result
            const [student, setStudent] = useState({ nama: '', kelas: '', tanggal: '' });
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(90 * 60); // 90 menit
            const [cheatCount, setCheatCount] = useState(0);
            const [score, setScore] = useState(0);
            const [finalStatus, setFinalStatus] = useState("");

            // Setup Ujian: Acak Soal & Opsi saat login berhasil
            const startTest = (e) => {
                e.preventDefault();
                if (!student.nama || !student.kelas || !student.tanggal) {
                    alert("Harap lengkapi semua data!"); return;
                }

                // Acak urutan soal
                let shuffledQuestions = shuffleArray(questionsData).map((q, index) => {
                    // Simpan teks jawaban yang benar
                    const correctAnswerText = q.options[q.ans];
                    // Acak opsi
                    const shuffledOptions = shuffleArray(q.options);
                    return {
                        id: index,
                        q: q.q,
                        options: shuffledOptions,
                        correctOptionText: correctAnswerText,
                        type: q.type
                    };
                });

                setQuestions(shuffledQuestions);
                setStep('test');
            };

            // Anti-Cheat: Deteksi Pindah Tab
            useEffect(() => {
                if (step !== 'test') return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setCheatCount(prev => {
                            const newCount = prev + 1;
                            if (newCount === 1) {
                                alert("PERINGATAN (1/2): Anda terdeteksi meninggalkan layar ujian! Jika mengulanginya, ujian akan otomatis diselesaikan.");
                            } else if (newCount >= 2) {
                                alert("PELANGGARAN KEDUA (2/2): Anda telah meninggalkan layar ujian lebih dari batas yang diizinkan. Ujian diakhiri otomatis.");
                                submitTest("Diskualifikasi (Cheat/Pindah Tab)", newCount);
                            }
                            return newCount;
                        });
                    }
                };

                document.addEventListener("visibilitychange", handleVisibilityChange);
                return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
            }, [step, answers]);

            // Timer
            useEffect(() => {
                if (step !== 'test') return;
                if (timeLeft <= 0) {
                    submitTest("Waktu Habis", cheatCount);
                    return;
                }
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [step, timeLeft]);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleAnswer = (qId, optionText) => {
                setAnswers(prev => ({ ...prev, [qId]: optionText }));
            };

            const submitTest = (statusOverride = "", currentCheat = cheatCount) => {
                setStep('submitting');
                
                // Hitung Skor (Pilihan Ganda Biasa)
                let correctCount = 0;
                questions.forEach(q => {
                    if (answers[q.id] === q.correctOptionText) correctCount++;
                });
                
                // Konversi 0-100 (jika 50 soal, tiap soal 2 poin)
                const finalScore = (correctCount / questions.length) * 100;
                setScore(finalScore);
                
                const status = statusOverride || "Selesai Normal";
                setFinalStatus(status);

                const payload = {
                    Timestamp: new Date().toLocaleString("id-ID"),
                    Nama: student.nama,
                    Kelas: student.kelas,
                    TanggalUjian: student.tanggal,
                    Skor: finalScore,
                    Pelanggaran: currentCheat,
                    KeteranganSelesai: status
                };

                fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    setStep('result');
                }).catch(err => {
                    console.error("Error submitting:", err);
                    setStep('result');
                });
            };

            if (step === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-600">
                            <h2 className="text-2xl font-bold text-center text-gray-800 mb-2">Aplikasi CBT</h2>
                            <p className="text-center text-gray-500 mb-6 font-semibold">Penilaian Kompetensi Bab 5<br/>Pendidikan Pancasila - Kelas IX</p>
                            <form onSubmit={startTest} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                                    <input type="text" required className="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                        value={student.nama} onChange={e => setStudent({...student, nama: e.target.value})} placeholder="Masukkan Nama Lengkap" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Kelas</label>
                                    <input type="text" required className="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                        value={student.kelas} onChange={e => setStudent({...student, kelas: e.target.value})} placeholder="Contoh: IX-A" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Tanggal Ujian</label>
                                    <input type="date" required className="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                        value={student.tanggal} onChange={e => setStudent({...student, tanggal: e.target.value})} />
                                </div>
                                <div className="bg-yellow-50 p-3 rounded text-sm text-yellow-800 border border-yellow-200">
                                    <i className="fa-solid fa-triangle-exclamation mr-2"></i><b>Aturan:</b> Waktu 90 Menit. Jangan keluar dari mode layar ujian / pindah tab. Pelanggaran 2x ujian otomatis dibatalkan.
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">
                                    Mulai Ujian
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (step === 'submitting') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <i className="fa-solid fa-spinner fa-spin text-5xl text-blue-600 mb-4"></i>
                        <h2 className="text-xl font-bold">Menyimpan Jawaban...</h2>
                        <p className="text-gray-500">Mohon tunggu, jangan tutup halaman ini.</p>
                    </div>
                );
            }

            if (step === 'result') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center border-t-4 border-green-500">
                            <i className="fa-solid fa-circle-check text-6xl text-green-500 mb-4"></i>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">Terima kasih, <b>{student.nama}</b>. Jawaban Anda telah tersimpan ke database.</p>
                            
                            <div className="bg-gray-100 p-4 rounded-lg mb-6 text-left space-y-2">
                                <p><b>Status:</b> {finalStatus}</p>
                                <p><b>Pelanggaran:</b> {cheatCount} kali</p>
                                {/* Opsi: Skor bisa disembunyikan jika tidak ingin ditampilkan ke siswa */}
                                <p><b>Nilai:</b> {score.toFixed(2)}</p>
                            </div>
                            
                            <button onClick={() => window.location.reload()} className="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-900 transition">
                                Kembali ke Awal
                            </button>
                        </div>
                    </div>
                );
            }

            // --- Tampilan Test ---
            const currentQuestion = questions[currentIndex];

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-gray-100">
                    {/* Main Content: Soal */}
                    <div className="flex-1 p-4 md:p-8 flex flex-col h-screen overflow-y-auto">
                        <div className="bg-white rounded-lg shadow p-4 mb-4 flex justify-between items-center border-b-4 border-blue-500">
                            <div>
                                <h1 className="font-bold text-lg text-gray-800">Pendidikan Pancasila Bab 5</h1>
                                <p className="text-sm text-gray-500">{student.nama} | {student.kelas}</p>
                            </div>
                            <div className={`font-mono text-xl font-bold px-4 py-2 rounded ${timeLeft < 300 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                                <i className="fa-regular fa-clock mr-2"></i>{formatTime(timeLeft)}
                            </div>
                        </div>

                        <div className="bg-white rounded-lg shadow p-6 flex-1 mb-4 flex flex-col">
                            <div className="flex justify-between items-start mb-6">
                                <h2 className="text-xl font-bold">Soal Nomor {currentIndex + 1}</h2>
                            </div>
                            
                            {/* Render Soal HTML Support */}
                            <div className="text-lg text-gray-800 mb-6 leading-relaxed" dangerouslySetInnerHTML={{ __html: currentQuestion.q }}></div>

                            {/* Opsi Jawaban: Fleksibel untuk Single/Multi/dll (Diimplementasikan Single/Radio untuk data PDF) */}
                            <div className="space-y-3 flex-1">
                                {currentQuestion.options.map((opt, idx) => {
                                    const isSelected = answers[currentQuestion.id] === opt;
                                    return (
                                        <label key={idx} className={`flex items-start p-4 border rounded-lg cursor-pointer transition ${isSelected ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                            <input 
                                                type={currentQuestion.type === "multi" ? "checkbox" : "radio"} 
                                                name={`q-${currentQuestion.id}`}
                                                className="mt-1 mr-3 h-5 w-5 text-blue-600"
                                                checked={isSelected}
                                                onChange={() => handleAnswer(currentQuestion.id, opt)}
                                            />
                                            <span dangerouslySetInnerHTML={{ __html: opt }}></span>
                                        </label>
                                    );
                                })}
                            </div>

                            {/* Navigasi Bawah */}
                            <div className="mt-8 pt-4 border-t flex justify-between">
                                <button 
                                    onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                                    disabled={currentIndex === 0}
                                    className="px-6 py-2 bg-gray-200 text-gray-700 rounded font-semibold disabled:opacity-50"
                                >
                                    <i className="fa-solid fa-chevron-left mr-2"></i>Sebelumnya
                                </button>
                                
                                {currentIndex === questions.length - 1 ? (
                                    <button onClick={() => { if(confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) submitTest(); }} className="px-6 py-2 bg-green-600 text-white rounded font-semibold hover:bg-green-700">
                                        Selesai Ujian <i className="fa-solid fa-check ml-2"></i>
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                                        className="px-6 py-2 bg-blue-600 text-white rounded font-semibold hover:bg-blue-700"
                                    >
                                        Selanjutnya <i className="fa-solid fa-chevron-right ml-2"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Sidebar: Grid Navigasi */}
                    <div className="w-full md:w-80 bg-white shadow-xl p-6 flex flex-col h-auto md:h-screen overflow-y-auto z-10 border-l">
                        <h3 className="font-bold text-gray-800 mb-4 pb-2 border-b">Navigasi Soal</h3>
                        <div className="grid grid-cols-5 gap-2 mb-8">
                            {questions.map((q, i) => {
                                const isAnswered = answers[q.id] !== undefined;
                                const isActive = currentIndex === i;
                                let classes = 'grid-btn ';
                                if (isAnswered) classes += 'answered ';
                                else classes += 'unanswered ';
                                if (isActive) classes += 'active ';

                                return (
                                    <button key={q.id} onClick={() => setCurrentIndex(i)} className={classes}>
                                        {i + 1}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="mt-auto space-y-2 text-sm border-t pt-4">
                            <div className="flex items-center"><div className="w-4 h-4 bg-green-500 rounded mr-2"></div> Sudah Dijawab</div>
                            <div className="flex items-center"><div className="w-4 h-4 bg-gray-200 border rounded mr-2"></div> Belum Dijawab</div>
                            <div className="flex items-center"><div className="w-4 h-4 border-2 border-blue-500 rounded mr-2"></div> Posisi Saat Ini</div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
