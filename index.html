            { id: 38, type: 'mc', question: "Apa arti 'tanah air' dalam konteks negara kepulauan seperti Indonesia?", options: ["Hanya daratan tempat penduduk tinggal", "Hanya laut yang mengelilingi pulau-pulau", "Kesatuan wilayah daratan dan perairan (lautan) yang tidak terpisahkan", "Wilayah pegunungan dan hutan"], correct: 2 },
            { id: 39, type: 'mc', question: "Rasa cinta tanah air perlu ditanamkan sejak dini. Tindakan yang mencerminkan kecintaan terhadap keutuhan wilayah adalah...", options: ["Menganggap budaya daerahnya lebih tinggi dari budaya daerah lain", "Bangga menggunakan produk dalam negeri dan mempelajari budaya daerah lain", "Mengeksploitasi alam demi kepentingan pribadi", "Menyebarkan ujaran kebencian di media sosial"], correct: 1 },
            { id: 40, type: 'mc', question: "Semboyan Bhinneka Tunggal Ika menginspirasi rakyat Indonesia untuk...", options: ["Menjadikan perbedaan sebagai alasan pemisahan wilayah", "Menjaga persatuan dan kesatuan bangsa di tengah perbedaan", "Menyeragamkan seluruh bahasa daerah menjadi satu bahasa lokal saja", "Menolak segala bentuk budaya yang masuk ke desa"], correct: 1 },
            { id: 41, type: 'mc', question: "Apabila ada sekelompok orang yang ingin merusak fasilitas umum, sikap kita sebagai warga yang mencintai NKRI adalah...", options: ["Ikut membantu agar cepat selesai", "Mencegah, menegur, dan melaporkan ke pihak berwenang", "Memotret dan menertawakan saja", "Mengabaikan karena bukan milik pribadi"], correct: 1 },
            { id: 42, type: 'mc', question: "Lagu kebangsaan atau lagu wajib nasional yang liriknya menegaskan keutuhan wilayah Indonesia yang 'berjajar pulau-pulau' adalah...", options: ["Indonesia Raya", "Padamu Negeri", "Dari Sabang Sampai Merauke", "Berkibarlah Benderaku"], correct: 2 },
            { id: 43, type: 'mc', question: "Sishankamrata bermakna bahwa kekuatan pertahanan bertumpu pada...", options: ["Teknologi nuklir yang dimiliki negara", "TNI dan Polri sebagai kekuatan utama, serta rakyat sebagai kekuatan pendukung", "Rakyat sipil sebagai kekuatan tempur utama", "Pasukan perdamaian dari negara asing"], correct: 1 },

            { id: 45, type: 'mc', question: "Kebijakan pemberian akses kesehatan, jalan, dan jembatan di daerah terpencil adalah bentuk pengamalan Pancasila untuk menguatkan persatuan, khususnya sila...", options: ["Pertama", "Kedua", "Keempat", "Kelima"], correct: 3 },
            { id: 46, type: 'mc', question: "Ketidakstabilan isu regional seperti konflik Semenanjung Korea atau geopolitik Laut Cina Selatan dapat mempengaruhi Indonesia. Oleh karena itu, Indonesia harus...", options: ["Ikut berperang membantu salah satu pihak", "Bersikap waspada dan memperkuat ketahanan nasional", "Memutuskan hubungan diplomatik dengan semua pihak yang berkonflik", "Meminta perlindungan pangkalan militer asing"], correct: 1 },
            { id: 47, type: 'mc', question: "Memanfaatkan pergaulan luas (termasuk internet) secara positif bagi pelajar untuk NKRI dapat berupa...", options: ["Menyebarkan hoaks tentang kondisi negara", "Mempromosikan keindahan alam dan kekayaan budaya Indonesia ke dunia", "Meretas situs-situs milik pemerintah", "Menghina ideologi bangsa lain"], correct: 1 },
            { id: 48, type: 'mc', question: "Sebagai negara hukum, penegakan kedaulatan di laut dilakukan jika ada kapal asing yang masuk tanpa izin dengan tujuan mencuri ikan, maka tindakan tegas negara adalah...", options: ["Menjual ikan bersama-sama kapal tersebut", "Melakukan penangkapan dan proses hukum sesuai kedaulatan NKRI", "Membiarkan asal mereka membayar pajak", "Nelayan lokal dilarang melaut"], correct: 1 },
            { id: 49, type: 'mc', question: "Untuk menanamkan toleransi, gotong royong, dan cinta kasih antarwarga, tindakan pencegahan konflik yang sangat efektif dilakukan di lingkungan masyarakat adalah...", options: ["Membuat acara dialog antarwarga dan kegiatan kerja bakti", "Membuat peraturan ketat tanpa sosialisasi", "Membangun pagar tinggi di tiap rumah", "Memisahkan tempat tinggal berdasarkan suku"], correct: 0 },
            { id: 50, type: 'mc', question: "Menjaga alam dan lingkungan sekitar merupakan wujud...", options: ["Mencari keuntungan isidental", "Komitmen menjaga NKRI di level komunitas", "Kewajiban pemerintah pusat semata", "Menghambat proses industrialisasi"], correct: 1 },
        ];

        // --- COMPONENTS ---

        const App = () => {
            const [page, setPage] = useState('login'); // login, resume-prompt, exam, result
            const [student, setStudent] = useState({ name: '', classRoom: '', examDate: new Date().toISOString().split('T')[0] });
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(EXAM_DURATION_MINUTES * 60);
            const [violations, setViolations] = useState(0);
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);

            // Load Saved Session
            useEffect(() => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    setPage('resume-prompt');
                }
            }, []);

            // Auto-Save Effect
            useEffect(() => {
                if (page === 'exam' && !isFinished) {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                finalizeExam("Waktu Habis");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    // Sync to LocalStorage
                    const session = {
                        student,
                        shuffledQuestions,
                        userAnswers,
                        timeLeft,
                        violations,
                        currentIndex
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(session));

                    return () => clearInterval(timer);
                }
            }, [page, userAnswers, timeLeft, violations, currentIndex, isFinished]);

            // Visibility Change Handler (Anti-Cheat)
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'hidden' && page === 'exam' && !isFinished) {
                        handleViolation();
                    }
                };
                
                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement && page === 'exam' && !isFinished) {
                        handleViolation();
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [page, isFinished]);

            const handleViolation = () => {
                setViolations(v => {
                    const newV = v + 1;
                    if (newV >= 2) {
                        finalizeExam("Pelanggaran Keamanan");
                    } else {
                        alert("PERINGATAN: Jangan meninggalkan halaman ujian atau keluar dari mode Fullscreen! Pelanggaran berikutnya akan mengakhiri ujian otomatis.");
                        enterFullscreen();
                    }
                    return newV;
                });
            };

            const enterFullscreen = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const startNewExam = () => {
                if (!student.name || !student.classRoom) {
                    alert("Harap lengkapi data diri!");
                    return;
                }
                const shuffled = [...questionsData].sort(() => Math.random() - 0.5);
                setShuffledQuestions(shuffled);
                setUserAnswers({});
                setTimeLeft(EXAM_DURATION_MINUTES * 60);
                setViolations(0);
                setCurrentIndex(0);
                setPage('exam');
                enterFullscreen();
            };

            const resumeExam = () => {
                const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
                setStudent(savedData.student);
                setShuffledQuestions(savedData.shuffledQuestions);
                setUserAnswers(savedData.userAnswers);
                setTimeLeft(savedData.timeLeft);
                setViolations(savedData.violations);
                setCurrentIndex(savedData.currentIndex);
                setPage('exam');
                enterFullscreen();
            };

            const finalizeExam = async (reason = "Selesai") => {
                if (isFinished) return;
                setIsFinished(true);

                // Calculate Score
                let scoreCount = 0;
                shuffledQuestions.forEach((q) => {
                    if (userAnswers[q.id] === q.correct) {
                        scoreCount++;
                    }
                });
                const finalScore = (scoreCount / shuffledQuestions.length) * 100;
                
                const payload = {
                    nama: student.name,
                    kelas: student.classRoom,
                    tanggal: student.examDate,
                    skor: finalScore.toFixed(2),
                    pelanggaran: violations,
                    keterangan: reason
                };

                setResults(payload);
                setPage('result');
                localStorage.removeItem(STORAGE_KEY);
                
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }

                // Send to Google Sheets
                try {
                    fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error("Gagal mengirim data ke Sheets", err);
                }
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // Views
            if (page === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-blue-600">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-slate-800">CBT PANCASILA</h1>
                                <p className="text-slate-500">Penilaian Kompetensi Bab 5 - Kelas IX</p>
                            </div>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                                    <input 
                                        type="text" 
                                        className="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none transition"
                                        placeholder="Masukkan nama sesuai absen..."
                                        value={student.name}
                                        onChange={(e) => setStudent({...student, name: e.target.value})}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-600 mb-1">Kelas</label>
                                    <input 
                                        type="text" 
                                        className="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none transition"
                                        placeholder="Contoh: IX-A"
                                        value={student.classRoom}
                                        onChange={(e) => setStudent({...student, classRoom: e.target.value})}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-600 mb-1">Tanggal Ujian</label>
                                    <input 
                                        type="date" 
                                        className="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none transition"
                                        value={student.examDate}
                                        onChange={(e) => setStudent({...student, examDate: e.target.value})}
                                    />
                                </div>
                                <button 
                                    onClick={startNewExam}
                                    className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-95 transition-all shadow-lg"
                                >
                                    MULAI UJIAN
                                </button>
                                <p className="text-[10px] text-center text-slate-400 mt-4">Ujian akan berjalan dalam mode Layar Penuh (Fullscreen)</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (page === 'resume-prompt') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-t-8 border-yellow-500">
                            <div className="mb-4 inline-flex p-4 bg-yellow-100 text-yellow-600 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            </div>
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Sesi Ujian Ditemukan!</h2>
                            <p className="text-slate-500 mb-6 text-sm leading-relaxed">Anda memiliki progres ujian yang tersimpan. Apakah ingin melanjutkan atau mulai ulang?</p>
                            <div className="grid grid-cols-1 gap-3">
                                <button onClick={resumeExam} className="py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">Lanjutkan Ujian</button>
                                <button onClick={() => { localStorage.removeItem(STORAGE_KEY); startNewExam(); }} className="py-3 bg-slate-200 text-slate-700 rounded-lg font-bold hover:bg-slate-300 transition">Mulai Ulang (Hapus Progres)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (page === 'exam') {
                const q = shuffledQuestions[currentIndex];
                return (
                    <div className="h-screen flex flex-col md:flex-row overflow-hidden bg-slate-100">
                        {/* Area Soal */}
                        <div className="flex-1 flex flex-col h-full bg-white relative">
                            {/* Header */}
                            <header className="px-6 py-4 border-b flex justify-between items-center bg-blue-600 text-white shadow-md">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center font-bold">CBT</div>
                                    <div>
                                        <h3 className="text-sm font-bold leading-tight">PEND. PANCASILA - BAB 5</h3>
                                        <p className="text-[10px] opacity-80 uppercase">{student.name} ({student.classRoom})</p>
                                    </div>
                                </div>
                                <div className={`px-4 py-2 rounded-full font-mono font-bold text-lg border-2 ${timeLeft < 300 ? 'bg-red-500 border-white animate-pulse' : 'bg-blue-800 border-blue-400'}`}>
                                    {formatTime(timeLeft)}
                                </div>
                            </header>

                            {/* Konten Soal */}
                            <main className="flex-1 overflow-y-auto p-6 md:p-10">
                                <div className="max-w-3xl mx-auto">
                                    <div className="flex items-center space-x-2 mb-4">
                                        <span className="bg-blue-100 text-blue-600 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider">Soal No. {currentIndex + 1}</span>
                                    </div>
                                    
                                    <h4 className="text-lg md:text-xl font-medium text-slate-800 leading-relaxed mb-8">
                                        {q.question}
                                    </h4>

                                    {/* Placeholder Gambar (Aturan No. 3) */}
                                    {q.image && (
                                        <div className="mb-6 rounded-xl border p-2 bg-slate-50">
                                            <img src={q.image} className="w-full max-h-80 object-contain rounded-lg" alt="Ilustrasi Soal" />
                                        </div>
                                    )}

                                    <div className="space-y-3">
                                        {q.options.map((option, idx) => (
                                            <button 
                                                key={idx}
                                                onClick={() => setUserAnswers({...userAnswers, [q.id]: idx})}
                                                className={`w-full group text-left p-4 rounded-xl border-2 transition-all flex items-center space-x-4 ${userAnswers[q.id] === idx ? 'border-blue-600 bg-blue-50 shadow-md ring-1 ring-blue-600' : 'border-slate-100 hover:border-slate-300 hover:bg-slate-50'}`}
                                            >
                                                <div className={`w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg font-bold transition-colors ${userAnswers[q.id] === idx ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600 group-hover:bg-slate-300'}`}>
                                                    {String.fromCharCode(65 + idx)}
                                                </div>
                                                <div className="text-slate-700 font-medium">{option}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </main>

                            {/* Footer Navigasi Bawah */}
                            <footer className="p-4 border-t bg-slate-50 flex justify-between items-center px-6">
                                <button 
                                    disabled={currentIndex === 0}
                                    onClick={() => setCurrentIndex(currentIndex - 1)}
                                    className="px-6 py-2 rounded-lg bg-white border border-slate-300 font-bold text-slate-600 hover:bg-slate-200 disabled:opacity-30 transition"
                                >
                                    Sebelumnya
                                </button>

                                <div className="hidden md:flex space-x-1">
                                    <span className="text-xs text-slate-400 font-bold uppercase tracking-widest">Progress</span>
                                    <span className="text-xs text-blue-600 font-bold uppercase tracking-widest">{Object.keys(userAnswers).length} / {shuffledQuestions.length} Terjawab</span>
                                </div>

                                {currentIndex === shuffledQuestions.length - 1 ? (
                                    <button 
                                        onClick={() => finalizeExam()}
                                        className="px-8 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 shadow-lg transition"
                                    >
                                        Selesai & Kumpul
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setCurrentIndex(currentIndex + 1)}
                                        className="px-8 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-lg transition"
                                    >
                                        Selanjutnya
                                    </button>
                                )}
                            </footer>
                        </div>

                        {/* Navigasi Nomor Kanan (Grid) */}
                        <aside className="w-full md:w-80 bg-slate-100 border-l flex flex-col h-full">
                            <div className="p-4 bg-white border-b text-center font-bold text-slate-700 tracking-wider">NAVIGASI SOAL</div>
                            <div className="flex-1 overflow-y-auto p-4 grid grid-cols-5 gap-2 content-start custom-scrollbar">
                                {shuffledQuestions.map((sq, i) => (
                                    <button 
                                        key={i}
                                        onClick={() => setCurrentIndex(i)}
                                        className={`h-10 rounded-lg flex items-center justify-center font-bold text-sm transition-all border-2 ${currentIndex === i ? 'bg-blue-600 text-white border-blue-400 scale-110 z-10 shadow-lg' : userAnswers[sq.id] !== undefined ? 'bg-green-500 text-white border-green-300' : 'bg-white text-slate-500 border-slate-200 hover:border-blue-400'}`}
                                    >
                                        {i + 1}
                                    </button>
                                ))}
                            </div>
                            <div className="p-6 bg-white border-t space-y-3">
                                <div className="flex items-center text-xs space-x-2">
                                    <div className="w-3 h-3 bg-green-500 rounded"></div>
                                    <span className="text-slate-500">Terjawab</span>
                                    <div className="w-3 h-3 bg-white border border-slate-300 rounded ml-2"></div>
                                    <span className="text-slate-500">Belum</span>
                                </div>
                                <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                    <div className="h-full bg-blue-600 transition-all duration-500" style={{width: `${(Object.keys(userAnswers).length / shuffledQuestions.length) * 100}%`}}></div>
                                </div>
                            </div>
                        </aside>
                    </div>
                );
            }

            if (page === 'result') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-lg text-center border-b-8 border-green-500">
                            <div className="mb-6 inline-flex p-4 bg-green-100 text-green-600 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            </div>
                            <h2 className="text-3xl font-black text-slate-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-slate-500 mb-8 font-medium italic">"Terima kasih telah mengerjakan ujian dengan jujur."</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-50 p-4 rounded-2xl border">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Skor Murni</p>
                                    <p className="text-4xl font-black text-blue-600">{results?.skor}</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl border">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Pelanggaran</p>
                                    <p className="text-4xl font-black text-red-500">{results?.pelanggaran}</p>
                                </div>
                            </div>

                            <div className="text-left bg-slate-50 p-6 rounded-2xl border space-y-2 mb-8">
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-xs text-slate-400">Nama</span>
                                    <span className="text-sm font-bold text-slate-700">{results?.nama}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-xs text-slate-400">Kelas</span>
                                    <span className="text-sm font-bold text-slate-700">{results?.kelas}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-xs text-slate-400">Keterangan</span>
                                    <span className="text-sm font-bold text-green-600 uppercase">{results?.keterangan}</span>
                                </div>
                            </div>

                            <button onClick={() => window.location.reload()} className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold hover:bg-slate-900 transition shadow-lg active:scale-95">
                                KELUAR APLIKASI
                            </button>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
